async function addTestResult(clientId){
  const c=getClient(clientId);
  const date=document.getElementById('tr_date').value || new Date().toISOString().slice(0,10);
  const type=document.getElementById('tr_type').value;
  const label=document.getElementById('tr_label').value || type;
  const notes=document.getElementById('tr_notes').value;
  const fileInput=document.getElementById('tr_file');
  const file = fileInput.files[0];
  const btn = document.getElementById('tr_submit_btn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  let filePath = null, fileName = null;
  if(file){
    filePath = `${clientId}/${uid()}-${file.name}`;
    const { error: upErr } = await sb.storage.from('test-results').upload(filePath, file);
    if(upErr){ showToast('Upload failed: '+upErr.message, true); btn.disabled=false; btn.textContent='Add Result'; return; }
    fileName = file.name;
  }
  const { data, error } = await sb.from('test_results').insert({
    client_id: clientId, date, type, label, notes, file_path: filePath, file_name: fileName
  }).select().single();
  if(error){ showToast('Could not save result: '+error.message, true); btn.disabled=false; btn.textContent='Add Result'; return; }
  const fileDataUrl = await resolveSignedUrl('test-results', filePath);
  c.testResults.push({ id:data.id, date, type, label, notes, fileName, fileDataUrl, filePath });
  render();
  showToast('Test result added');
}
async function deleteTestResult(clientId, resultId){
  const c=getClient(clientId);
  const item = c.testResults.find(t=>t.id===resultId);
  const { error } = await sb.from('test_results').delete().eq('id', resultId);
  if(error){ showToast('Could not remove result: '+error.message, true); return; }
  if(item && item.filePath){ await sb.storage.from('test-results').remove([item.filePath]); }
  c.testResults = c.testResults.filter(t=>t.id!==resultId);
  render(); showToast('Test result removed');
}

/* ======================================================================
   CLIENT: OWN DASHBOARD
   ====================================================================== */
function renderDailyTrackerCard(c){
  return `
  <div class="card qform-card" style="margin-bottom:16px;">
    <h3 style="margin-bottom:2px;">Daily Tracker</h3>
    <p class="muted" style="font-size:12.5px;margin-top:0;">Log this as you go through the week for your own reference.</p>
    ${renderDailyTable(c.dailyDraft||[], true)}
    <button class="btn btn-sm" style="margin-top:12px;" onclick="saveDailyTracker('${c.id}')">Save Daily Tracker</button>
  </div>`;
}
function renderClientInfoReadCard(c){
  const days = (c.checkinDays && c.checkinDays.length) ? c.checkinDays : [c.checkinDay||'Monday'];
  const daysLabel = days.map(d=>d.slice(0,3)).join(', ');
  return `
  <div class="card" style="margin-bottom:16px;"><h3>Your Info</h3>
    <div class="muted" style="font-size:12.5px;line-height:1.9;">
      Name: <span style="color:var(--text);">${escapeHtml(c.name||'')}</span><br>
      Goal: <span style="color:var(--text);">${escapeHtml(c.goal||'—')}</span><br>
      Check-in day(s): <span style="color:var(--text);">${escapeHtml(daysLabel)}</span>
    </div>
  </div>`;
}
function renderClientOwnDashboard(c){
  const lc=latestCheckin(c);
  const days = (c.checkinDays && c.checkinDays.length) ? c.checkinDays : [c.checkinDay||'Monday'];
  const daysLabel = days.map(d=>d.slice(0,3)).join(', ');
  if(!lc){
    return `<div class="card" style="margin-bottom:16px;"><div class="empty">You haven't submitted a check-in yet — head to PBP Check-In in the sidebar to get started.</div></div>
    ${renderDailyTrackerCard(c)}
    ${renderClientInfoReadCard(c)}`;
  }
  const delta=weightChange(c);
  const weighed = weighedCheckins(c);
  const startWeight = weighed.length ? weighed[0].weight : null;
  return `
  <div class="grid cards-4" style="margin-bottom:16px;">
    <div class="card"><div class="stat-label">Starting Weight</div><div class="stat-value">${startWeight!=null?startWeight:'—'} kg</div></div>
    <div class="card"><div class="stat-label">Current Weight</div><div class="stat-value">${hasWeight(lc)?lc.weight:'—'} kg</div><div class="stat-delta ${delta<0?'delta-pos':'delta-neg'}">${delta>0?'+':''}${delta} kg total</div></div>
    <div class="card"><div class="stat-label">Overall Adherence Last Week</div><div class="stat-value">${(lc.overallAdherence||0).toFixed(1)}/5</div></div>
    <div class="card"><div class="stat-label">Next Check-In Due</div><div class="stat-value" style="font-size:18px;">${escapeHtml(daysLabel)}</div></div>
  </div>
  ${renderDailyTrackerCard(c)}
  <div class="card" style="margin-bottom:16px;"><h3>Weight Trend</h3><div class="chart-wrap"><canvas id="weightChart"></canvas></div></div>
  ${renderClientInfoReadCard(c)}`;
}
async function saveDailyTracker(clientId){
  const days = collectDailyTable();
  const { error } = await sb.from('daily_drafts').upsert({ client_id: clientId, days, updated_at: new Date().toISOString() });
  if(error){ showToast('Could not save daily tracker: '+error.message, true); return; }
  getClient(clientId).dailyDraft = days;
  showToast('Daily tracker saved');
}

/* ======================================================================
   CLIENT: PBP CHECK-IN FORM (the one, main weekly check-in)
   ====================================================================== */
function ratingRow(id, question, leftLabel, rightLabel, def, max){
  max = max || 5;
  def = def || Math.ceil(max/2);
  const buttons = Array.from({length:max}, (_,i)=>i+1).map(n=>
    `<button type="button" class="rating-btn${n===def?' active':''}" onclick="selectRating('${id}',${n},this)">${n}</button>`).join('');
  return `<div class="field">
    <label style="text-transform:none;font-size:13px;color:var(--text);font-weight:600;">${question}</label>
    <div class="rating-row">
      ${leftLabel?`<span class="slider-endlabel">${leftLabel}</span>`:''}
      <div class="rating-btn-group">${buttons}</div>
      ${rightLabel?`<span class="slider-endlabel right">${rightLabel}</span>`:''}
    </div>
    <input type="hidden" id="${id}" value="${def}">
  </div>`;
}
function selectRating(id, val, btn){
  document.getElementById(id).value = val;
  btn.parentElement.querySelectorAll('.rating-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function textQ(id, question, placeholder){
  return `<div class="field"><label style="text-transform:none;font-size:13px;color:var(--text);font-weight:600;">${question}</label><input type="text" id="${id}" placeholder="${placeholder||''}"></div>`;
}
function areaQ(id, question, placeholder){
  return `<div class="field"><label style="text-transform:none;font-size:13px;color:var(--text);font-weight:600;">${question}</label><textarea id="${id}" placeholder="${placeholder||''}"></textarea></div>`;
}
function selectQ(id, question, options){
  return `<div class="field"><label style="text-transform:none;font-size:13px;color:var(--text);font-weight:600;">${question}</label><select id="${id}">${options.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
}

function renderCheckinQuestionInput(q){
  const id = 'pbp_'+q.key;
  if(q.type==='textarea') return areaQ(id, q.label, q.placeholder);
  if(q.type==='select') return selectQ(id, q.label, q.options||[]);
  if(q.type==='rating') return ratingRow(id, q.label, '', '', 3);
  return textQ(id, q.label, q.placeholder);
}
function renderWeeklyCheckinForm(c){
  return `
  <div class="card qform-card">
    <h3 style="margin-bottom:2px;">PBP Checkin — Week ${c.checkins.length+1}</h3>
    <p class="muted" style="font-size:12.5px;margin-top:0;">Please submit your answers below to complete your check in.</p>
    <div class="field" style="max-width:220px;"><label>Check-In Date</label><div id="pbp_date" style="padding:9px 0;font-size:13.5px;color:var(--text);">${new Date().toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'})}</div></div>
  </div>

  <div class="card qform-card">
    ${CHECKIN_QUESTIONS.map(q=>renderCheckinQuestionInput(q)).join('')}
  </div>

  <div class="card qform-card">
    <h3 style="margin-bottom:2px;">Progress Photos</h3>
    <p class="muted" style="font-size:12.5px;margin-top:0;">Tap + to add one or more photos per angle.</p>
    <div class="row" style="gap:24px;">
      ${uploadBox('front','Front')} ${uploadBox('side','Side')} ${uploadBox('back','Back')}
    </div>
  </div>

  <button class="btn" id="checkinSubmitBtn" onclick="submitWeeklyCheckin('${c.id}')">Submit Check-In</button>
  `;
}
let checkinPhotoDrafts = {front:[],side:[],back:[]};
function uploadBox(key,label){
  return `<div class="photo-upload-group">
    <div class="muted" style="font-size:12.5px;font-weight:600;">${label}</div>
    <div class="photo-thumbs" id="thumbs_${key}">${(checkinPhotoDrafts[key]||[]).map((url,i)=>photoThumbHTML(key,url,i)).join('')}</div>
    <label class="photo-add-btn" for="file_${key}">+</label>
    <input type="file" accept="image/*" multiple id="file_${key}" style="display:none" onchange="handlePhotoUpload('${key}')">
  </div>`;
}
function photoThumbHTML(key, url, i){
  return `<div class="photo-thumb" style="background-image:url(${url})"><span class="rm" onclick="removeCheckinPhoto('${key}',${i})">&#10005;</span></div>`;
}
function handlePhotoUpload(key){
  const input=document.getElementById('file_'+key);
  const files = Array.from(input.files||[]);
  files.forEach(file=>{
    resizeImage(file, 900, 0.75, dataUrl=>{
      checkinPhotoDrafts[key].push(dataUrl);
      const wrap = document.getElementById('thumbs_'+key);
      if(wrap) wrap.innerHTML = checkinPhotoDrafts[key].map((url,i)=>photoThumbHTML(key,url,i)).join('');
    });
  });
  input.value = '';
}
function removeCheckinPhoto(key, idx){
  checkinPhotoDrafts[key].splice(idx,1);
  const wrap = document.getElementById('thumbs_'+key);
  if(wrap) wrap.innerHTML = checkinPhotoDrafts[key].map((url,i)=>photoThumbHTML(key,url,i)).join('');
}
function resizeImage(file, maxDim, quality, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>cb(e.target.result);
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function uploadPhotosForAngle(clientId, week, angle){
  const urls = checkinPhotoDrafts[angle] || [];
  const paths = [];
  for(let i=0;i<urls.length;i++){
    const blob = await (await fetch(urls[i])).blob();
    const path = `${clientId}/week${week}-${angle}-${uid()}.jpg`;
    const { error } = await sb.storage.from('progress-photos').upload(path, blob, { contentType:'image/jpeg' });
    if(error){ showToast(`Could not upload a ${angle} photo: ${error.message}`, true); continue; }
    paths.push(path);
  }
  return paths;
}

async function submitWeeklyCheckin(clientId){
  const c=getClient(clientId);
  const days = c.dailyDraft || [];
  const weightEl = document.getElementById('pbp_weight');
  if(weightEl && !weightEl.value){ showToast('Please enter your weight to submit your check-in', true); return; }

  const submitBtn = document.getElementById('checkinSubmitBtn');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Submitting…'; }

  const week = c.checkins.length+1;
  const date = new Date().toISOString().slice(0,10);

  const [frontPaths, sidePaths, backPaths] = await Promise.all([
    uploadPhotosForAngle(clientId, week, 'front'),
    uploadPhotosForAngle(clientId, week, 'side'),
    uploadPhotosForAngle(clientId, week, 'back')
  ]);

  const payload = {
    days,
    photos: { front:frontPaths, side:sidePaths, back:backPaths },
    coachFeedback: 'Awaiting coach review'
  };
  CHECKIN_QUESTIONS.forEach(q=>{
    const el = document.getElementById('pbp_'+q.key);
    if(!el) return;
    if(q.type==='rating') payload[q.key] = parseInt(el.value);
    else if(q.key==='weight') payload[q.key] = parseFloat(el.value) || 0;
    else payload[q.key] = el.value;
  });

  const { data, error } = await sb.from('checkins').insert({ client_id: clientId, week, date, payload }).select().single();
  if(error){
    showToast('Could not submit check-in: '+error.message, true);
    if(submitBtn){ submitBtn.disabled=false; submitBtn.textContent='Submit Check-In'; }
    return;
  }

  const newCheckin = { id:data.id, week, date, ...payload };
  newCheckin.photos = {
    front: await Promise.all(frontPaths.map(p=>resolveSignedUrl('progress-photos', p))),
    side: await Promise.all(sidePaths.map(p=>resolveSignedUrl('progress-photos', p))),
    back: await Promise.all(backPaths.map(p=>resolveSignedUrl('progress-photos', p)))
  };
  c.checkins.push(newCheckin);

  // Clear the drafts now that they've been submitted, ready for next week.
  checkinPhotoDrafts = {front:[],side:[],back:[]};
  await sb.from('daily_drafts').delete().eq('client_id', clientId);
  c.dailyDraft = [];

  showToast('Check-in submitted to your coach!');
  state.page='client-history';
  render();
}
