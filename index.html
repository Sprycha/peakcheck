<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PeakCheck &mdash; Client Check-In Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PeakCheck">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#161923; --panel2:#1d212e; --border:#2a2f3d;
    --text:#eef0f5; --sub:#9aa1b4; --accent:#ff5c35; --accent2:#ffb238;
    --green:#3ddc84; --red:#ff5c5c; --blue:#4da3ff; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#333849;border-radius:4px;}

  #sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px 8px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:17px;letter-spacing:.2px;}
  .brand-sub{font-size:11px;color:var(--sub);}
  .navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--sub);cursor:pointer;font-size:13.5px;font-weight:600;border:1px solid transparent;}
  .navlink:hover{background:var(--panel2);color:var(--text);}
  .navlink.active{background:rgba(255,92,53,0.12);color:var(--accent);border-color:rgba(255,92,53,0.35);}
  .nav-icon{width:18px;text-align:center;flex-shrink:0;}
  .nav-section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#565d70;margin:14px 8px 4px;font-weight:700;}
  .sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
  .sidebar-footer .btn-ghost{width:100%;text-align:center;}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--panel);gap:16px;flex-wrap:wrap;}
  .role-toggle{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
  .role-btn{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);}
  .role-btn.active{background:var(--accent);color:#fff;}
  .client-select{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
  .page-title{font-size:20px;font-weight:800;}
  .page-sub{font-size:12.5px;color:var(--sub);margin-top:2px;}

  #content{padding:24px;overflow-y:auto;flex:1;}

  .grid{display:grid;gap:16px;}
  .cards-3{grid-template-columns:repeat(3,1fr);}
  .cards-2{grid-template-columns:repeat(2,1fr);}
  .cards-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:1100px){.cards-3,.cards-4{grid-template-columns:repeat(2,1fr);} }
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .card h3{margin:0 0 4px;font-size:14px;}
  .stat-label{font-size:12px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .stat-value{font-size:26px;font-weight:800;margin-top:6px;}
  .stat-delta{font-size:12.5px;font-weight:700;margin-top:4px;}
  .delta-pos{color:var(--green);}
  .delta-neg{color:var(--red);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge-green{background:rgba(61,220,132,0.15);color:var(--green);}
  .badge-red{background:rgba(255,92,92,0.15);color:var(--red);}
  .badge-amber{background:rgba(255,178,56,0.15);color:var(--accent2);}
  .badge-blue{background:rgba(77,163,255,0.15);color:var(--blue);}

  .client-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s;}
  .client-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .client-card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .client-card-name{font-weight:700;font-size:15px;}
  .client-card-goal{font-size:12px;color:var(--sub);}
  .mini-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--border);}
  .mini-row span:first-child{color:var(--sub);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--sub);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .spreadsheet td{padding:4px 5px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;}
  .tab.active{color:var(--accent);border-color:var(--accent);}
  .tab-remove{color:var(--sub);font-size:11px;cursor:pointer;line-height:1;}
  .tab-remove:hover{color:var(--red);}

  label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:8px 9px;border-radius:8px;font-size:13px;font-family:inherit;
  }
  input:disabled,select:disabled,textarea:disabled{opacity:.65;cursor:not-allowed;}
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:14px;}
  .btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn:hover{background:#e6501f;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:110px;}

  .photo-box{aspect-ratio:3/4;background:var(--panel2);border:1.5px dashed var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-size:12px;cursor:pointer;overflow:hidden;position:relative;text-align:center;padding:8px;background-size:cover;background-position:center;}
  .photo-box:hover{border-color:var(--accent);color:var(--accent);}
  .photo-label{position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.55);padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;color:#fff;}

  .empty{color:var(--sub);font-size:13px;padding:30px;text-align:center;}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .day-pill{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;min-width:130px;}
  .day-pill b{display:block;font-size:12.5px;margin-bottom:3px;color:var(--accent2);}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#04361a;padding:14px 20px;border-radius:10px;font-weight:700;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:999;display:none;max-width:340px;}
  .toast.warn{background:var(--accent2);color:#3a2400;}
  .flag-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--red);font-weight:600;margin-top:8px;}
  .section-title{font-size:16px;font-weight:800;margin:0 0 14px;}
  .muted{color:var(--sub);}
  .chart-wrap{height:220px;}
  .compound-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;margin-left:6px;white-space:nowrap;}
  .tag-anabolic{background:rgba(255,92,92,.15);color:var(--red);}
  .tag-oral{background:rgba(255,178,56,.15);color:var(--accent2);}
  .tag-ancillary{background:rgba(77,163,255,.15);color:var(--blue);}
  .tag-peptide{background:rgba(61,220,132,.15);color:var(--green);}
  .tag-other{background:rgba(154,161,180,.15);color:var(--sub);}

  .dyn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr)) 34px;gap:6px;margin-bottom:6px;align-items:center;}
  .dyn-row.food-row{grid-template-columns:1.6fr .7fr .7fr .7fr .7fr .7fr 1fr 34px;}
  .dyn-row.ped-row{grid-template-columns:1.3fr .9fr 1fr 1fr 1.1fr 1.2fr 34px;}
  .dyn-row.supp-row{grid-template-columns:1fr 1.2fr .9fr 1fr 1.2fr 34px;}
  .dyn-row-remove{background:transparent;border:1px solid var(--border);color:var(--red);border-radius:8px;cursor:pointer;height:34px;}
  .meal-block{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--panel2);}
  .meal-block h4{margin:0 0 8px;font-size:13px;color:var(--accent2);}
  .meal-total{font-size:12px;color:var(--sub);margin-top:6px;text-align:right;}
  .food-read-row{padding:10px 0;border-bottom:1px solid var(--border);}
  .food-read-row:last-child{border-bottom:none;}
  .food-read-name{font-weight:700;font-size:14px;color:var(--text);}
  .food-read-meta{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:3px;}
  .food-read-grams{font-size:12px;color:var(--accent2);font-weight:700;}
  .food-read-macros{font-size:12.5px;color:var(--sub);}
  .food-read-notes{font-size:11.5px;margin-top:3px;}
  .macro-summary{display:flex;flex-wrap:wrap;gap:10px 6px;padding:14px 16px;}
  .macro-summary-row{flex:1;min-width:64px;text-align:center;}
  .macro-summary-row span{display:block;font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:4px;}
  .macro-summary-row b{font-size:17px;font-weight:800;}
  .macro-summary-row b i{font-style:normal;font-weight:600;font-size:13px;color:var(--sub);}
  @media(max-width:820px){ .macro-summary{padding:12px;gap:8px 4px;} .macro-summary-row b{font-size:14px;} .macro-summary-row b i{font-size:10.5px;} .macro-summary-row span{font-size:9px;} }
  .meal-target-table{margin-bottom:10px;}
  .meal-target-table td,.meal-target-table th{font-size:12px;}
  .client-food-table input{font-size:13px;padding:6px 7px;}
  .client-food-table td:first-child{min-width:130px;}
  .exercise-read-row{padding:8px 0;border-bottom:1px solid var(--border);}
  .exercise-read-row:last-child{border-bottom:none;}
  .exercise-read-name{font-weight:700;font-size:13.5px;}
  .exercise-read-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:2px;font-size:12px;}
  .exercise-read-reps{color:var(--accent2);font-weight:700;}
  .meal-instructions-read{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;}
  .meal-instructions-read .meal-instructions-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);font-weight:700;margin-bottom:4px;}
  .meal-instructions-read p{margin:0;font-size:13px;line-height:1.5;white-space:pre-wrap;}
  .food-edit-row{border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg);}
  .pedsupp-add-panel{border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:14px;background:var(--bg);}
  .pedsupp-add-title{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;}
  .pedsupp-add-row{margin-bottom:2px;}
  .pedsupp-add-row .field{margin-bottom:12px;}
  .food-edit-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .food-edit-top .food-name{flex:1;}
  .food-edit-top .dyn-row-remove{width:34px;flex-shrink:0;}
  .food-edit-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}

  .meal-block-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .meal-block-header h4{margin:0;}
  .meal-name{font-weight:700;font-size:13.5px;padding:8px 10px;margin-bottom:4px;width:100%;}
  .meal-header-macros{font-size:12px;color:var(--sub);}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:8px;cursor:pointer;width:30px;height:30px;font-size:14px;line-height:1;flex-shrink:0;}
  .icon-btn:hover{color:var(--text);border-color:var(--accent2);}
  .icon-btn-danger{color:var(--red);}
  .icon-btn-danger:hover{color:var(--red);border-color:var(--red);}
  .food-picker-panel{background:var(--panel);border-radius:14px;max-width:480px;width:100%;margin:20px auto;padding:18px;max-height:calc(100vh - 40px);overflow:auto;}
  .food-picker-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .food-picker-panel > input[type=text]{width:100%;margin-bottom:12px;}
  .food-picker-list{max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}
  .food-picker-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);}
  .food-picker-row:last-child{border-bottom:none;}
  .food-picker-row.selected{background:var(--panel2);}
  .food-picker-selected{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .tab-add{color:var(--accent2);}
  .checkin-feedback-thread{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:340px;overflow-y:auto;}
  .checkin-msg{display:flex;flex-direction:column;max-width:78%;}
  .checkin-msg-coach{align-self:flex-start;align-items:flex-start;}
  .checkin-msg-client{align-self:flex-end;align-items:flex-end;}
  .checkin-msg-bubble{border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.4;white-space:pre-wrap;}
  .checkin-msg-coach .checkin-msg-bubble{background:var(--panel2);border:1px solid var(--border);}
  .checkin-msg-client .checkin-msg-bubble{background:var(--accent);color:#fff;}
  .checkin-msg-meta{font-size:10px;color:var(--sub);margin-top:3px;}
  .checkin-feedback-input{display:flex;gap:8px;}
  .checkin-feedback-input input{flex:1;}
  .day-pick{display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--sub);user-select:none;}
  .day-pick.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .notif-section-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
  .notif-list{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
  .notif-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .notif-row:last-child{border-bottom:none;}
  .notif-row:hover{background:var(--panel2);}
  .notif-row-text{flex:1;min-width:0;}
  .notif-row-name{font-weight:700;font-size:13.5px;}
  .notif-row-sub{font-size:11.5px;color:var(--sub);margin-top:1px;}
  .notif-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .notif-chevron{color:var(--sub);font-size:18px;flex-shrink:0;}
  .mini-field{display:flex;flex-direction:column;gap:2px;}
  .mini-field label{font-size:9.5px;margin-bottom:0;color:var(--sub);}
  @media(max-width:640px){ .food-edit-grid{grid-template-columns:repeat(3,1fr);} }
  .filecard{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;background:var(--panel2);gap:12px;flex-wrap:wrap;}
  .filecard-left b{font-size:13.5px;}
  .filecard-left div{font-size:12px;color:var(--sub);margin-top:2px;}
  .collapsible summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--accent2);padding:4px 0;}
  .disclaimer{font-size:12px;color:var(--accent2);background:rgba(255,178,56,.08);border:1px solid rgba(255,178,56,.25);padding:10px 12px;border-radius:8px;margin-top:12px;}
  .info-note{font-size:12.5px;color:var(--sub);background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--blue);padding:10px 12px;border-radius:8px;margin-bottom:14px;line-height:1.6;}
  .drag-handle{cursor:grab;touch-action:none;color:var(--sub);padding:4px 6px;user-select:none;font-size:14px;line-height:1;flex-shrink:0;}
  .drag-handle:hover{color:var(--text);}
  .dragging-row{opacity:0.5;}
  body.dragging-active{cursor:grabbing;}
  body.dragging-active *{cursor:grabbing !important;}
  .meal-copy-popover{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:10px;}
  input[type=range]{accent-color:var(--accent);flex:1;}
  .slider-row{display:flex;align-items:center;gap:10px;}
  .slider-val{font-weight:700;width:26px;text-align:center;flex-shrink:0;}
  .slider-endlabel{font-size:11px;color:var(--sub);flex-shrink:0;min-width:70px;}
  .slider-endlabel.right{text-align:right;}
  .rating-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .rating-btn-group{display:flex;flex-wrap:wrap;gap:8px;}
  .rating-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
  .rating-btn:hover{border-color:var(--accent);color:var(--accent);}
  .rating-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .photo-upload-group{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .photo-thumbs{display:flex;flex-wrap:wrap;gap:6px;}
  .photo-thumb{position:relative;width:56px;height:56px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--border);flex-shrink:0;}
  .photo-thumb .rm{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
  .photo-add-btn{width:56px;height:56px;border:1.5px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--sub);cursor:pointer;flex-shrink:0;}
  .photo-add-btn:hover{border-color:var(--accent);color:var(--accent);}
  .photo-thumb-empty{width:56px;height:56px;border:1.5px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);text-align:center;}
  .photo-thumb-selected{border:2px solid var(--accent);}
  .photo-compare-preview{width:100%;height:180px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--border);}
  .qform-card{margin-bottom:16px;}
  .qform-card h4{margin:0 0 6px;font-size:13.5px;}
  .qa-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--panel2);}
  .qa-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .qa-row:last-child{border-bottom:none;}

/* ======================================================================
   DRAG TO REORDER — generic pointer-based row reordering (mouse + touch).
   A small grip handle on a row starts the drag; as the pointer moves the
   row is swapped past its neighbours' midpoints; on release, onReorder
   (fromIndex, toIndex) is called so the caller can persist the new order.
   ====================================================================== */
function startRowDrag(e, containerEl, rowSelector, onReorder){
  e.preventDefault();
  const row = e.target.closest(rowSelector);
  if(!row || !containerEl) return;
  const startRows = Array.from(containerEl.querySelectorAll(rowSelector));
  const startIndex = startRows.indexOf(row);
  if(startIndex===-1) return;
  row.classList.add('dragging-row');
  document.body.classList.add('dragging-active');
  function onMove(ev){
    const y = ev.clientY;
    const rows = Array.from(containerEl.querySelectorAll(rowSelector)).filter(r=>r!==row);
    let after = null;
    for(const r of rows){
      const rect = r.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      if(y < mid){ after = r; break; }
    }
    if(after) containerEl.insertBefore(row, after);
    else containerEl.appendChild(row);
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    row.classList.remove('dragging-row');
    document.body.classList.remove('dragging-active');
    const endRows = Array.from(containerEl.querySelectorAll(rowSelector));
    const endIndex = endRows.indexOf(row);
    if(endIndex!==-1 && endIndex!==startIndex) onReorder(startIndex, endIndex);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

/* ---- DB row <-> app-shape mapping (keeps every existing render function unchanged) ---- */
function rowToClient(row){
  return {
    id: row.id, name: row.name, initials: row.initials, color: row.color,
    goal: row.goal, height: row.height, checkinDay: row.checkin_day, coachNotes: row.coach_notes,
    checkinDays: (row.checkin_days && row.checkin_days.length) ? row.checkin_days : [row.checkin_day || 'Monday'],
    targets: row.targets || {steps:9000,water:4,sleep:8,cardio:30},
    mealPlan: { training:[], rest:[], refeed:[], ...(row.meal_plan||{}) },
    clientMealLog: { training:[], rest:[], refeed:[], ...(row.client_meal_log||{}) },
    mealDayTypes: (row.meal_day_types && row.meal_day_types.length) ? row.meal_day_types : null,
    archived: !!row.archived,
    trainingSplit: row.training_split || [], schedule: row.schedule || [], cardioNotes: row.cardio_notes || '',
    pedSuppNotes: row.pedsupp_notes || '',
    invitedEmail: row.invited_email || null, inviteSentAt: row.invite_sent_at || null, hasAccount: false,
    testResults: [], checkins: []
  };
}
function checkinRowToObj(row){ return { id: row.id, week: row.week, date: row.date, coachReviewed: !!row.coach_reviewed, messages: row.messages || [], ...row.payload }; }

async function resolveSignedUrl(bucket, path){
  if(!path) return null;
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if(error){ console.warn('signed url error', bucket, path, error); return null; }
  return data.signedUrl;
}

async function fetchClientFull(clientId){
  const { data: crow, error: cerr } = await sb.from('clients').select('*').eq('id', clientId).single();
  if(cerr || !crow) throw cerr || new Error('Client not found');
  const client = rowToClient(crow);

  const { data: cirows, error: cierr } = await sb.from('checkins').select('*').eq('client_id', clientId).order('week');
  if(cierr) throw cierr;
  client.checkins = await Promise.all((cirows||[]).map(async row=>{
    const ci = checkinRowToObj(row);
    const paths = ci.photos || {front:[],side:[],back:[]};
    const asArray = v => Array.isArray(v) ? v : (v ? [v] : []); // backward-compat with old single-photo checkins
    ci.photos = {
      front: await Promise.all(asArray(paths.front).map(p=>resolveSignedUrl('progress-photos', p))),
      side: await Promise.all(asArray(paths.side).map(p=>resolveSignedUrl('progress-photos', p))),
      back: await Promise.all(asArray(paths.back).map(p=>resolveSignedUrl('progress-photos', p)))
    };
    return ci;
  }));

  const { data: trows, error: terr } = await sb.from('test_results').select('*').eq('client_id', clientId).order('date');
  if(terr) throw terr;
  client.testResults = await Promise.all((trows||[]).map(async row=>({
    id: row.id, date: row.date, type: row.type, label: row.label, notes: row.notes,
    fileName: row.file_name, fileDataUrl: await resolveSignedUrl('test-results', row.file_path)
  })));

  const { data: plrows, error: plerr } = await sb.from('ped_logs').select('*').eq('client_id', clientId).order('sort_order');
  if(plerr) throw plerr;
  client.pedLogs = plrows || [];

  const { data: slrows, error: slerr } = await sb.from('supplement_logs').select('*').eq('client_id', clientId).order('sort_order');
  if(slerr) throw slerr;
  client.supplementLogs = slrows || [];

  const { data: ddrow, error: dderr } = await sb.from('daily_drafts').select('*').eq('client_id', clientId).maybeSingle();
  if(dderr) throw dderr;
  client.dailyDraft = (ddrow && ddrow.days) || [];

  return client;
}

async function fetchReferenceData(){
  const { data, error } = await sb.from('reference_data').select('*').order('name');
  if(error){ console.error(error); return; }
  NUTRITION_DB = (data||[]).filter(r=>r.kind==='food').map(r=>({ id:r.id, food:r.name, cals:r.cals, protein:r.protein, carbs:r.carbs, fats:r.fats, unit:r.unit, base:r.base }));
  PED_REFERENCE = (data||[]).filter(r=>r.kind==='ped').map(r=>({ id:r.id, name:r.name, cat:r.category }));
  SUPPLEMENT_REFERENCE = (data||[]).filter(r=>r.kind==='supplement').map(r=>({ id:r.id, name:r.name, cat:r.category }));
}
async function fetchFormConfig(){
  const { data: qrows, error: qerr } = await sb.from('checkin_questions').select('*').order('sort_order');
  if(qerr){ console.error(qerr); } else {
    CHECKIN_QUESTIONS = (qrows||[]).map(r=>({ id:r.id, key:r.key, label:r.label, type:r.type, options:r.options||[], placeholder:r.placeholder||'' }));
  }
  const { data: drows, error: derr } = await sb.from('daily_tracker_fields').select('*').order('sort_order');
  if(derr){ console.error(derr); } else {
    DAILY_FIELDS = (drows||[]).map(r=>({ id:r.id, k:r.key, l:r.label, t:r.type, opts:r.options||[], min:r.min===null?undefined:r.min, max:r.max===null?undefined:r.max, step:r.step===null?undefined:r.step }));
  }
}

async function loadAppData(){
  await fetchReferenceData();
  await fetchFormConfig();
  if(state.role==='coach'){
    const { data: crows, error } = await sb.from('clients').select('id').order('created_at');
    if(error) throw error;
    clients = await Promise.all((crows||[]).map(r=>fetchClientFull(r.id)));
    const { data: prows } = await sb.from('profiles').select('client_id').eq('role','client');
    const withAccounts = new Set((prows||[]).map(p=>p.client_id).filter(Boolean));
    clients.forEach(c=>{ c.hasAccount = withAccounts.has(c.id); });
    state.currentClientId = clients[0] ? clients[0].id : null;
  } else {
    const cid = myProfile.client_id;
    if(!cid){ clients=[]; return; }
    const client = await fetchClientFull(cid);
    clients = [client];
    state.currentClientId = client.id;
  }
}

async function initAuth(){
  const { data:{ session:s } } = await sb.auth.getSession();

  await loadProfileAndApp();
}
async function loadProfileAndApp(){
  const { data: prow, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(error || !prow){
    renderCompleteProfileScreen();
    return;
  }
  myProfile = prow;
  state.role = prow.role;
  state.page = prow.role==='coach' ? 'dashboard' : 'client-dashboard';
  document.getElementById('app').innerHTML = `<div class="loading-screen">Loading your data…</div>`;
  if(prow.org_id){
    const { data: orgRow } = await sb.from('orgs').select('*').eq('id', prow.org_id).single();
    if(orgRow){ myOrg = orgRow; applyOrgBranding(orgRow); }
  }
  try{
    await loadAppData();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="loading-screen">Could not load data — ${ (e&&e.message)||e }.<br><br>Make sure peakcheck_schema.sql has been run in your Supabase project's SQL Editor.</div>`;
    return;
  }
  render();
}
async function handleSignIn(){
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  const errEl = document.getElementById('authError');
  errEl.style.display='none';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = error.message; errEl.style.display='block'; return; }
  session = data.session;
  await loadProfileAndApp();
}
async function handleSignUp(){
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  const errEl = document.getElementById('authError');
  errEl.style.display='none';
  if(!email || !password || password.length<6){ errEl.textContent='Enter an email and a password (6+ characters).'; errEl.style.display='block'; return; }

  const { data: exists } = await sb.rpc('coach_exists');
  if(exists){ errEl.textContent='A coach account already exists for this project — sign in instead.'; errEl.style.display='block'; return; }

  const { data, error } = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: window.location.origin } });
  if(error){ errEl.textContent = error.message; errEl.style.display='block'; return; }

  if(!data.session){
    renderAuthScreen('Account created — check your email to confirm it, then sign in.');
    return;
  }
  session = data.session;
  const profileRow = { id: data.user.id, email, role:'coach', client_id: null };
  const { error: perr } = await sb.from('profiles').insert(profileRow);
  if(perr){ errEl.textContent = 'Account created but profile setup failed: '+perr.message; errEl.style.display='block'; return; }
  await loadProfileAndApp();
}
async function handleSignOut(){

/* ======================================================================

   ====================================================================== */
function latestCheckin(c){ return c.checkins.length ? c.checkins[c.checkins.length-1] : null; }
function dayAvg(days, key){ if(!days||!days.length) return 0; return days.reduce((a,d)=>a+(parseFloat(d[key])||0),0)/days.length; }
function hasWeight(ci){ return typeof ci.weight==='number' && !isNaN(ci.weight) && ci.weight>0; }
function weighedCheckins(c){ return c.checkins.filter(hasWeight); }
function weightChange(c){
  const weighed = weighedCheckins(c);
  if(weighed.length<2) return 0;
  const first = weighed[0].weight;
  const last = weighed[weighed.length-1].weight;
  return (last-first).toFixed(1);
}
function daysSinceCheckin(c){
  const last=latestCheckin(c); if(!last) return Infinity;
  const d=new Date(last.date); const today=new Date();
  return Math.round((today-d)/(1000*60*60*24));
}

function daysAgoLabel(days){
  if(days===Infinity) return 'never';
  if(days<=0) return 'today';
  if(days===1) return '1 day ago';
  return `${days} days ago`;
}
function goToClientHistory(clientId){
  state.currentClientId = clientId;
  state.page = 'client-detail';
  state.detailTab = 'history';
  render();
}
function renderCoachDashboard(){
  const activeClients = clients.filter(c=>!c.archived);
  const archivedCount = clients.length - activeClients.length;
  const withCheckins = activeClients.filter(c=>c.checkins.length>0);
  const needsReview = withCheckins.filter(c=>{ const lc=latestCheckin(c); return lc && !lc.coachReviewed; })
    .sort((a,b)=>new Date(latestCheckin(b).date)-new Date(latestCheckin(a).date));
  const avgAdh = withCheckins.length ? Math.round(withCheckins.reduce((a,c)=>a+(latestCheckin(c).overallAdherence||0),0)/withCheckins.length*20) : 0;
  return `
  <div class="grid cards-4" style="margin-bottom:20px;">
    <div class="card"><div class="stat-label">Active Clients</div><div class="stat-value">${activeClients.length}</div></div>
    <div class="card"><div class="stat-label">Check-ins This Week</div><div class="stat-value">${activeClients.filter(c=>daysSinceCheckin(c)<=7).length}/${activeClients.length}</div></div>
    <div class="card"><div class="stat-label">Needs Review</div><div class="stat-value" style="color:var(--accent)">${needsReview.length}</div></div>
    <div class="card"><div class="stat-label">Avg. Adherence</div><div class="stat-value">${avgAdh}%</div></div>
  </div>
  ${needsReview.length>0?`
  <div class="notif-section-label">Needs review — new check-ins</div>
  <div class="notif-list">
    ${needsReview.map(c=>{ const lc=latestCheckin(c); return `
    <div class="notif-row" onclick="goToClientHistory('${c.id}')">
      <div class="notif-dot"></div>
      <div class="avatar" style="background:${c.color}">${c.initials}</div>
      <div class="notif-row-text"><div class="notif-row-name">${escapeHtml(c.name)}</div><div class="notif-row-sub">Submitted Week ${lc.week} check-in — ${daysAgoLabel(daysSinceCheckin(c))}</div></div>
      <i class="notif-chevron">&rsaquo;</i>
    </div>`; }).join('')}
  </div>`:''}
  <div class="section-title">Clients</div>
  <div id="inviteFormWrap"></div>
  ${activeClients.length===0?`<div class="card"><div class="empty">No active clients yet — add your first one from All Clients.</div></div>`:`<div class="grid cards-3">${activeClients.map(c=>renderClientCard(c)).join('')}</div>`}
  ${archivedCount>0?`<div class="muted" style="font-size:12.5px;margin-top:16px;cursor:pointer;" onclick="goToArchivedClients()">${archivedCount} archived client${archivedCount===1?'':'s'} — view</div>`:''}`;
}
function renderClientCard(c){
  const lc=latestCheckin(c); const overdue = daysSinceCheckin(c)>7;
  return `
  <div class="client-card" onclick="selectClient('${c.id}')">
    <div class="client-card-top">
      <div class="avatar" style="background:${c.color}">${c.initials}</div>
      <div style="flex:1;min-width:0;"><div class="client-card-name">${escapeHtml(c.name)}${c.archived?` <span class="badge" style="background:rgba(154,161,180,.15);color:var(--sub);">Archived</span>`:''}</div><div class="client-card-goal">${escapeHtml(c.goal||'')}</div></div>
    </div>
    ${!lc ? `<div class="mini-row"><span>Status</span><span class="badge badge-amber">No check-ins yet</span></div>` : `
    <div class="mini-row"><span>Current Weight</span><span>${hasWeight(lc)?lc.weight:'—'} kg</span></div>
    <div class="mini-row"><span>Total Change</span><span class="${weightChange(c)<0?'delta-pos':'delta-neg'}">${weightChange(c)>0?'+':''}${weightChange(c)} kg</span></div>
    <div class="mini-row"><span>Overall Adherence</span><span>${(lc.overallAdherence||0).toFixed(1)}/5</span></div>
    <div class="mini-row"><span>Last Check-In</span><span>${overdue?`<span class="badge badge-red">${daysSinceCheckin(c)}d ago</span>`:`<span class="badge badge-green">Up to date</span>`}</span></div>`}
    ${inviteStatusRow(c)}
    <div style="margin-top:10px;" onclick="event.stopPropagation();">
      ${c.archived
        ? `<button type="button" class="btn-sm btn-ghost" style="width:100%;" onclick="setClientArchived('${c.id}',false)">Restore to Active</button>
        <button type="button" class="btn-sm btn-ghost" style="width:100%;margin-top:6px;color:var(--red);" onclick="deleteClientPermanently('${c.id}')">Delete Permanently</button>`
        : `<button type="button" class="btn-sm btn-ghost" style="width:100%;color:var(--sub);" onclick="setClientArchived('${c.id}',true)">Archive Client</button>`}
    </div>
  </div>`;
}

function inviteStatusRow(c){
  if(c.hasAccount){
    return `<div class="mini-row"><span>Account</span><span class="badge badge-green">Active</span></div>`;

}
let inviteFormClientId = null;
function openInviteForm(clientId){
  inviteFormClientId = clientId;
  const c = getClient(clientId);
  const wrap = document.getElementById('inviteFormWrap');
  if(!c || !wrap) return;
  wrap.innerHTML = `

    <div class="auth-error" id="inv_error" style="display:none;"></div>

async function sendClientInvite(){
  const clientId = inviteFormClientId;
  const email = document.getElementById('inv_email').value.trim();
  const errEl = document.getElementById('inv_error');
  errEl.style.display='none';
  if(!email || !email.includes('@')){ errEl.textContent='Enter a valid email address.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('inv_send_btn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const { data:{ session:s } } = await sb.auth.getSession();
    const res = await fetch('/.netlify/functions/invite-client', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+(s?s.access_token:'') },
      body: JSON.stringify({ email, clientId })
    });
    const result = await res.json().catch(()=>({}));
    if(!res.ok){ throw new Error(result.error || 'Could not send invite'); }
    const c = getClient(clientId);
    if(c){ c.invitedEmail = email; c.inviteSentAt = new Date().toISOString(); }
    const wrap = document.getElementById('inviteFormWrap');
    if(wrap) wrap.innerHTML = '';
    showToast(`Invite sent to ${email}`);
    render();
  }catch(e){
    errEl.textContent = e.message; errEl.style.display='block';
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Send Invite'; }
  }
}
async function setClientArchived(clientId, archived){
  const c = getClient(clientId);
  if(!c) return;
  const { error } = await sb.from('clients').update({ archived }).eq('id', clientId);
  if(error){ showToast('Could not update client: '+error.message, true); return; }
  c.archived = archived;
  showToast(archived ? `${c.name} archived — moved out of your active list` : `${c.name} restored to active`);
  render();
}
async function deleteClientPermanently(clientId){
  const c = getClient(clientId);
  if(!c) return;
  if(!confirm(`Permanently delete ${c.name}? This deletes all their check-ins, photos, logs, and their account if they've signed up. This cannot be undone.`)) return;
  try{
    const { data:{ session:s } } = await sb.auth.getSession();
    const res = await fetch('/.netlify/functions/delete-client', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+(s?s.access_token:'') },
      body: JSON.stringify({ clientId })
    });
    const result = await res.json().catch(()=>({}));
    if(!res.ok){ throw new Error(result.error || 'Could not delete client'); }
    clients = clients.filter(x=>x.id!==clientId);
    if(state.currentClientId === clientId){ state.currentClientId = clients[0] ? clients[0].id : null; }
    showToast(`${c.name} deleted`);

async function sendCoachInvite(){
  const name = document.getElementById('ac_name').value.trim();
  const email = document.getElementById('ac_email').value.trim();
  const accent = document.getElementById('ac_accent').value;
  const accent2 = document.getElementById('ac_accent2').value;
  const errEl = document.getElementById('ac_error');
  errEl.style.display='none';
  if(!name){ errEl.textContent='Enter a business/coach name.'; errEl.style.display='block'; return; }
  if(!email || !email.includes('@')){ errEl.textContent='Enter a valid email address.'; errEl.style.display='block'; return; }
  const btn = document.getElementById('ac_send_btn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const { data:{ session:s } } = await sb.auth.getSession();
    const res = await fetch('/.netlify/functions/invite-coach', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+(s?s.access_token:'') },
      body: JSON.stringify({ email, orgName:name, accent, accent2 })
    });
    const result = await res.json().catch(()=>({}));
    if(!res.ok){ throw new Error(result.error || 'Could not send invite'); }
    document.getElementById('addCoachFormWrap').innerHTML = '';
    showToast(`Invite sent to ${email}`);
    await loadCoachOrgs();
    render();
  }catch(e){
    errEl.textContent = e.message; errEl.style.display='block';
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Send Invite'; }
  }
}

function formatMsgTime(iso){

  const d = new Date(iso);

}
async function sendCheckinMessage(clientId, checkinId, sender){
  const c = getClient(clientId);
  const ci = c && c.checkins.find(x=>x.id===checkinId);
  if(!ci) return;
  const inputEl = document.getElementById('fbmsg_'+checkinId);
  const text = inputEl ? inputEl.value.trim() : '';
  if(!text){ showToast('Write a message first', true); return; }
  const newMessages = [...(ci.messages||[]), { sender, text, at: new Date().toISOString() }];
  const payload = { messages: newMessages };
  if(sender==='coach') payload.coach_reviewed = true;
  const { error } = await sb.from('checkins').update(payload).eq('id', checkinId);
  if(error){ showToast('Could not send message: '+error.message, true); return; }
  ci.messages = newMessages;

let photoGalleries = [];
function registerGallery(urls, labels){
  const id = photoGalleries.length;
  photoGalleries.push({ urls, labels: labels||[] });
  return id;
}
function openLightbox(galleryId, startIdx){
  const g = photoGalleries[galleryId];
  if(!g || !g.urls.length) return;
  closeLightbox();
  const imgsHtml = g.urls.map((u,i)=>`<div class="lightbox-img-wrap">${g.labels[i]?`<div class="lightbox-label">${g.labels[i]}</div>`:''}<img src="${u}" class="lightbox-img"></div>`).join('');
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.id = 'photoLightbox';
  overlay.innerHTML = `<button class="lightbox-close" onclick="closeLightbox()">&#10005;</button><div class="lightbox-imgs">${imgsHtml}</div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeLightbox(); });
  document.body.appendChild(overlay);
  setTimeout(()=>{
    const wraps = overlay.querySelectorAll('.lightbox-img-wrap');
    if(wraps[startIdx] && wraps[startIdx].scrollIntoView) wraps[startIdx].scrollIntoView({inline:'center', block:'nearest'});
  }, 30);
}
function closeLightbox(){
  const el = document.getElementById('photoLightbox');
  if(el) el.remove();
  document.removeEventListener('keydown', carouselKeyHandler);
}
/* Single-photo carousel viewer — used for a check-in's own front/side/back photos.
   Clicking any thumbnail opens just that photo; arrows step through the rest
   of that check-in's photos in front -> side -> back order. */
let carouselState = { galleryId: null, idx: 0 };
function openPhotoCarousel(galleryId, startIdx){
  const g = photoGalleries[galleryId];
  if(!g || !g.urls.length) return;
  closeLightbox();
  carouselState = { galleryId, idx: startIdx||0 };
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.id = 'photoLightbox';
  overlay.innerHTML = renderCarouselContent();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeLightbox(); });
  document.body.appendChild(overlay);
  document.addEventListener('keydown', carouselKeyHandler);
}
function renderCarouselContent(){
  const g = photoGalleries[carouselState.galleryId];
  const idx = carouselState.idx;
  const label = g.labels[idx] || '';
  const hasPrev = idx > 0, hasNext = idx < g.urls.length - 1;
  const multi = g.urls.length > 1;
  return `
    <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
    <div class="lightbox-carousel">
      <button class="lightbox-nav" onclick="carouselStep(-1)" ${hasPrev?'':'disabled'} style="${multi?'':'visibility:hidden;'}">&#10094;</button>
      <div class="lightbox-img-wrap">
        ${label?`<div class="lightbox-label">${label}</div>`:''}
        <img src="${g.urls[idx]}" class="lightbox-img">
        ${multi?`<div class="lightbox-counter">${idx+1} / ${g.urls.length}</div>`:''}
      </div>
      <button class="lightbox-nav" onclick="carouselStep(1)" ${hasNext?'':'disabled'} style="${multi?'':'visibility:hidden;'}">&#10095;</button>
    </div>`;
}
function carouselStep(delta){
  const g = photoGalleries[carouselState.galleryId];
  if(!g) return;
  const newIdx = carouselState.idx + delta;
  if(newIdx<0 || newIdx>=g.urls.length) return;
  carouselState.idx = newIdx;
  const overlay = document.getElementById('photoLightbox');
  if(overlay) overlay.innerHTML = renderCarouselContent();
}
function carouselKeyHandler(e){
  if(!document.getElementById('photoLightbox')) return;
  if(e.key==='Escape') closeLightbox();
  else if(e.key==='ArrowLeft') carouselStep(-1);
  else if(e.key==='ArrowRight') carouselStep(1);
}
function normPhotoUrls(v){ return Array.isArray(v) ? v : (v ? [v] : []); }
function buildCheckinPhotoGallery(ci){
  const front = normPhotoUrls(ci.photos.front);
  const side = normPhotoUrls(ci.photos.side);
  const back = normPhotoUrls(ci.photos.back);
  const urls = [...front, ...side, ...back];
  const labels = [...front.map(()=>'Front'), ...side.map(()=>'Side'), ...back.map(()=>'Back')];
  const gid = registerGallery(urls, labels);
  return { gid, front, side, back };
}
function renderPhotosTab(c){
  if(c.checkins.length===0) return `<div class="card"><div class="empty">No check-ins submitted yet.</div></div>`;
  photoGalleries = [];
  const compareHtml = c.checkins.length>=2 ? renderPhotoCompareCard(c) : '';
  return `${compareHtml}<div class="grid" style="grid-template-columns:1fr;gap:20px;">
    ${c.checkins.slice().reverse().map(ci=>{
      const g = buildCheckinPhotoGallery(ci);
      return `
      <div class="card">
        <h3 style="margin-bottom:12px;">Week ${ci.week} — ${ci.date}</h3>
        <div class="grid cards-3">
          ${photoBox('Front', g.front, g.gid, 0)}
          ${photoBox('Side', g.side, g.gid, g.front.length)}
          ${photoBox('Back', g.back, g.gid, g.front.length+g.side.length)}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function photoBox(label, urls, galleryId, offset){
  urls = Array.isArray(urls) ? urls : (urls?[urls]:[]);
  offset = offset||0;
  return `<div>
    <div class="muted" style="font-size:12px;margin-bottom:6px;">${label}</div>
    ${urls.length===0 ? `<div class="photo-thumb-empty">No photo</div>` : `
    <div class="photo-thumbs">
      ${urls.map((u,i)=>`<div class="photo-thumb" style="background-image:url(${u});cursor:pointer;" onclick="openPhotoCarousel(${galleryId},${offset+i})"></div>`).join('')}
    </div>`}
  </div>`;
}
let compareSelA = null; // {url, label}
let compareSelB = null;
function combinedPhotosFor(ci){
  const angles = [['front','Front'],['side','Side'],['back','Back']];
  const out = [];
  angles.forEach(([key,label])=>{
    const urls = Array.isArray(ci.photos[key]) ? ci.photos[key] : (ci.photos[key]?[ci.photos[key]]:[]);
    urls.forEach((u,i)=> out.push({ url: u, label: urls.length>1 ? `${label} ${i+1}` : label }));
  });
  return out;
}
function jsEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function renderPhotoCompareCard(c){
  const sorted = c.checkins; // ascending by week already
  const n = sorted.length;
  const bIdx = n-1, aIdx = Math.max(0, n-2);
  const photosA = combinedPhotosFor(sorted[aIdx]);
  const photosB = combinedPhotosFor(sorted[bIdx]);
  compareSelA = photosA.length ? { url: photosA[0].url, label: `Week ${sorted[aIdx].week} — ${photosA[0].label}` } : null;
  compareSelB = photosB.length ? { url: photosB[0].url, label: `Week ${sorted[bIdx].week} — ${photosB[0].label}` } : null;
  return `
  <div class="card" style="margin-bottom:20px;">
    <h3 style="margin-bottom:10px;">Compare Progress Photos</h3>
    <p class="muted" style="font-size:12px;margin-top:0;">Pick a week on each side, then tap one photo from each to compare them.</p>
    <div class="row">
      <div class="field"><label>Week A</label><select id="cmp_a" onchange="updatePhotoCompare('${c.id}')">
        ${sorted.map((ci,i)=>`<option value="${i}" ${i===aIdx?'selected':''}>Week ${ci.week} — ${ci.date}</option>`).join('')}
      </select></div>
      <div class="field"><label>Week B</label><select id="cmp_b" onchange="updatePhotoCompare('${c.id}')">
        ${sorted.map((ci,i)=>`<option value="${i}" ${i===bIdx?'selected':''}>Week ${ci.week} — ${ci.date}</option>`).join('')}
      </select></div>
    </div>
    <div id="photoCompareGrid">${photoCompareGrid(c.id, sorted[aIdx], sorted[bIdx])}</div>
  </div>`;
}
function photoCompareThumbRow(clientId, ci, photos, side){
  if(photos.length===0) return `<div class="photo-thumb-empty">No photos this week</div>`;
  const sel = side==='A' ? compareSelA : compareSelB;
  return `<div class="photo-thumbs">
    ${photos.map(p=>`<div class="photo-thumb ${sel && sel.url===p.url ? 'photo-thumb-selected':''}" style="background-image:url(${p.url});cursor:pointer;" title="${p.label}" onclick="selectComparePhoto('${clientId}','${side}','${jsEsc(p.url)}','${jsEsc('Week '+ci.week+' — '+p.label)}')"></div>`).join('')}
  </div>`;
}
function photoCompareGrid(clientId, ciA, ciB){
  const photosA = combinedPhotosFor(ciA);
  const photosB = combinedPhotosFor(ciB);
  const combined = [], labels = [];
  if(compareSelA){ combined.push(compareSelA.url); labels.push(compareSelA.label); }
  if(compareSelB){ combined.push(compareSelB.url); labels.push(compareSelB.label); }

  const bIdxInGallery = compareSelA ? 1 : 0;
  return `
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;">
    <div>
      <div class="muted" style="font-size:11.5px;margin-bottom:8px;">Week ${ciA.week} photos</div>
      ${photoCompareThumbRow(clientId, ciA, photosA, 'A')}
    </div>
    <div>
      <div class="muted" style="font-size:11.5px;margin-bottom:8px;">Week ${ciB.week} photos</div>
      ${photoCompareThumbRow(clientId, ciB, photosB, 'B')}
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;">
    <div style="text-align:center;">
      <div class="muted" style="font-size:11px;margin-bottom:6px;">${compareSelA ? escapeHtml(compareSelA.label) : 'Select a photo'}</div>
      ${compareSelA ? `<div class="photo-compare-preview" style="background-image:url(${compareSelA.url});cursor:pointer;" onclick="openLightbox(${gid},0)"></div>` : `<div class="photo-thumb-empty" style="width:100%;height:180px;">No photo selected</div>`}
    </div>
    <div style="text-align:center;">
      <div class="muted" style="font-size:11px;margin-bottom:6px;">${compareSelB ? escapeHtml(compareSelB.label) : 'Select a photo'}</div>
      ${compareSelB ? `<div class="photo-compare-preview" style="background-image:url(${compareSelB.url});cursor:pointer;" onclick="openLightbox(${gid},${bIdxInGallery})"></div>` : `<div class="photo-thumb-empty" style="width:100%;height:180px;">No photo selected</div>`}
    </div>
  </div>`;
}
function selectComparePhoto(clientId, side, url, label){
  if(side==='A') compareSelA = { url, label }; else compareSelB = { url, label };
  const c = getClient(clientId);

/* ======================================================================
   MEAL PLAN — coach's prescribed plan (c.mealPlan) and the client's own
   editable food log (c.clientMealLog) share the same rendering + food-picker
   UI. "target" is 'plan' (coach editing the prescribed plan) or 'log'
   (client editing their own substitutions) — kept as separate DB columns
   so the client's edits never overwrite the coach's original plan.
   ====================================================================== */
function macroSum(items, key){ return items.reduce((a,it)=>a+(parseFloat(it[key])||0),0); }
function prescribedMealsFor(c, dayType){
  return (c.mealPlan[dayType] && c.mealPlan[dayType].length) ? c.mealPlan[dayType] : MEAL_NAMES.map(name=>({ name, time:'', items:[], instructions:'' }));
}
function clientMealLogFor(c, dayType){
  const log = c.clientMealLog && c.clientMealLog[dayType];
  if(log && log.length) return log;
  // Not started yet — seed a working copy from the coach's prescribed plan.
  return prescribedMealsFor(c, dayType).map(m => ({ name: m.name, time: m.time, items: (m.items||[]).map(it=>({...it})) }));
}
function mealsForTarget(c, dayType, target){
  return target==='plan' ? prescribedMealsFor(c, dayType) : clientMealLogFor(c, dayType);
}
async function saveMealsForTarget(clientId, dayType, meals, target){
  const c = getClient(clientId);
  if(target==='plan'){
    const newMealPlan = { ...c.mealPlan, [dayType]: meals };
    const { error } = await sb.from('clients').update({ meal_plan: newMealPlan }).eq('id', clientId);
    if(error) return { error };
    c.mealPlan = newMealPlan;
    return {};
  }
  const newLog = { ...c.clientMealLog, [dayType]: meals };
  const { error } = await sb.from('clients').update({ client_meal_log: newLog }).eq('id', clientId);
  if(error) return { error };
  c.clientMealLog = newLog;
  return {};
}
function renderMealPlanBlock(c, editable){

  return `
  <div class="tabs" id="mealDayTabs">

async function deleteDayType(clientId, dayType){

  const dayTypes = dayTypesFor(c);
  if(dayTypes.length<=1){ showToast('You need at least one day type', true); return; }

  const newDayTypes = dayTypes.filter(([k])=>k!==dayType);

  const newLog = { ...c.clientMealLog }; delete newLog[dayType];

  if(error){ showToast('Could not delete day type: '+error.message, true); return; }
  c.mealDayTypes = newDayTypes;
  c.mealPlan = newMealPlan;

}
function renderDayContent(c, dayType, isCoach){
  const meals = mealsForTarget(c, dayType, isCoach?'plan':'log');
  let summaryHTML;
  if(isCoach){
    const t = {cals:0,protein:0,carbs:0,fats:0};
    meals.forEach(m=>{ t.cals+=macroSum(m.items,'cals'); t.protein+=macroSum(m.items,'protein'); t.carbs+=macroSum(m.items,'carbs'); t.fats+=macroSum(m.items,'fats'); });
    summaryHTML = `
    <div class="card macro-summary" style="margin-bottom:16px;">
      <div class="macro-summary-row"><span>Calories</span><b>${Math.round(t.cals)}</b></div>
      <div class="macro-summary-row"><span>Protein</span><b>${Math.round(t.protein)}g</b></div>
      <div class="macro-summary-row"><span>Carbs</span><b>${Math.round(t.carbs)}g</b></div>
      <div class="macro-summary-row"><span>Fats</span><b>${Math.round(t.fats)}g</b></div>
    </div>`;
  } else {
    const prescribed = prescribedMealsFor(c, dayType);
    const target = {cals:0,protein:0,carbs:0,fats:0};
    prescribed.forEach(m=>{ target.cals+=macroSum(m.items,'cals'); target.protein+=macroSum(m.items,'protein'); target.carbs+=macroSum(m.items,'carbs'); target.fats+=macroSum(m.items,'fats'); });
    const actual = {cals:0,protein:0,carbs:0,fats:0};
    meals.forEach(m=>{ actual.cals+=macroSum(m.items,'cals'); actual.protein+=macroSum(m.items,'protein'); actual.carbs+=macroSum(m.items,'carbs'); actual.fats+=macroSum(m.items,'fats'); });
    summaryHTML = `
    <div class="card macro-summary" style="margin-bottom:16px;">
      <div class="macro-summary-row"><span>Calories</span><b>${Math.round(actual.cals)}<i>/${Math.round(target.cals)}</i></b></div>
      <div class="macro-summary-row"><span>Protein</span><b>${Math.round(actual.protein)}<i>/${Math.round(target.protein)}g</i></b></div>
      <div class="macro-summary-row"><span>Carbs</span><b>${Math.round(actual.carbs)}<i>/${Math.round(target.carbs)}g</i></b></div>
      <div class="macro-summary-row"><span>Fats</span><b>${Math.round(actual.fats)}<i>/${Math.round(target.fats)}g</i></b></div>
    </div>`;
  }
  return `
  ${summaryHTML}
  <div class="card" data-daytype="${dayType}" id="mealDayCard">
    ${meals.map((meal,mi)=>renderMealBlockUnified(c, dayType, meal, mi, isCoach, meals.length)).join('')}
    ${isCoach ? `<button type="button" class="btn-sm btn-ghost" onclick="addMealToDay('${c.id}','${dayType}')">+ Add Meal</button>` : `
    <div class="row" style="margin-top:4px;"><button type="button" class="btn-sm btn-ghost" onclick="resetClientMealLog('${c.id}','${dayType}')">Reset to Coach's Plan</button></div>`}
  </div>`;
}
function renderMealBlockUnified(c, dayType, meal, mi, isCoach, mealCount){
  const total = {cals:macroSum(meal.items,'cals'), protein:macroSum(meal.items,'protein'), carbs:macroSum(meal.items,'carbs'), fats:macroSum(meal.items,'fats')};
  const prescribedMeal = isCoach ? meal : (prescribedMealsFor(c, dayType)[mi] || {items:[],instructions:''});
  let macroLine;
  if(isCoach){
    macroLine = `${Math.round(total.cals)} kcal · ${Math.round(total.protein)}p / ${Math.round(total.carbs)}c / ${Math.round(total.fats)}f`;
  } else {
    const t = {cals:macroSum(prescribedMeal.items,'cals'), protein:macroSum(prescribedMeal.items,'protein'), carbs:macroSum(prescribedMeal.items,'carbs'), fats:macroSum(prescribedMeal.items,'fats')};
    macroLine = `${Math.round(total.cals)}/${Math.round(t.cals)} kcal · ${Math.round(total.protein)}/${Math.round(t.protein)}p / ${Math.round(total.carbs)}/${Math.round(t.carbs)}c / ${Math.round(total.fats)}/${Math.round(t.fats)}f`;
  }
  const instructions = prescribedMeal.instructions || '';
  const target = isCoach ? 'plan' : 'log';
  const popId = `copyPop_${dayType}_${mi}`;
  return `
  <div class="meal-block" data-meal-idx="${mi}">
    <div class="meal-block-header">
      ${isCoach && mealCount>1 ? `<span class="drag-handle" style="margin-top:6px;" onpointerdown="startMealBlockDrag(event,'${c.id}','${dayType}')" aria-label="Drag to reorder meal">&#10022;&#10022;</span>` : ''}
      <div style="flex:1;min-width:0;">
        ${isCoach ? `<input type="text" class="meal-name" value="${(meal.name||'').replace(/"/g,'&quot;')}" placeholder="Meal name" onchange="renameMeal('${c.id}','${dayType}',${mi},this.value)">` : `<h4 style="margin:0;">${escapeHtml(meal.name)}${meal.time?` <span class="muted" style="font-weight:400;">— ${escapeHtml(meal.time)}</span>`:''}</h4>`}
        <div class="meal-header-macros">${macroLine}</div>
      </div>
      ${isCoach ? `<div style="display:flex;gap:6px;flex-shrink:0;">
        <button type="button" class="icon-btn" onclick="toggleMealCopyPopover('${popId}','${c.id}','${dayType}',${mi})" aria-label="Copy meal">&#128203;</button>
        <button type="button" class="icon-btn icon-btn-danger" onclick="deleteMeal('${c.id}','${dayType}',${mi})" aria-label="Delete meal">&#128465;</button>
      </div>` : ''}
    </div>
    ${isCoach ? `
    <div class="meal-copy-popover" id="${popId}" style="display:none;">
      <div class="row" style="gap:8px;">
        <div class="field" style="flex:1;"><label>Copy to day</label>
          <select id="copyDaySel_${dayType}_${mi}" onchange="updateCopyMealSlotOptions('${c.id}','${dayType}',${mi})">
            ${dayTypesFor(c).map(([k,label])=>`<option value="${k}"${k===dayType?' selected':''}>${escapeHtml(label)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1;"><label>Copy to meal</label>
          <select id="copySlotSel_${dayType}_${mi}"></select>
        </div>
      </div>
      <button type="button" class="btn-sm" style="width:100%;" onclick="confirmCopyMeal('${c.id}','${dayType}',${mi})">Copy</button>
    </div>` : ''}
    <div class="meal-food-rows" data-daytype="${dayType}" data-meal-idx="${mi}">
      ${meal.items.length===0 ? `<div class="muted" style="font-size:12.5px;padding:6px 0;">No foods added yet.</div>` : meal.items.map((it,ii)=>mealFoodRow(it, c.id, dayType, mi, ii, target, meal.items.length>1)).join('')}
    </div>
    <button type="button" class="btn-sm btn-ghost" style="margin-top:8px;" onclick="openFoodPicker('${c.id}','${dayType}',${mi},null,'${target}')">+ Add Food</button>
    ${isCoach ? `
    <div class="field" style="margin-top:12px;margin-bottom:0;"><label>Instructions for this meal</label><textarea class="meal-instructions" rows="2" placeholder="e.g. 3iu log when you sit down to eat meal, can add mushroom/onions etc..." onchange="saveMealInstructions('${c.id}','${dayType}',${mi},this.value)">${escapeHtml(instructions)}</textarea></div>
    ` : (instructions ? `<div class="meal-instructions-read"><div class="meal-instructions-label">Instructions</div><p>${escapeHtml(instructions)}</p></div>` : '')}
  </div>`;
}
function mealFoodRow(item, clientId, dayType, mealIdx, itemIdx, target, multi){
  const ref = NUTRITION_DB.find(f=>f.food.toLowerCase()===(item.food||'').trim().toLowerCase());
  const isUnit = ref && ref.unit==='unit';
  const amount = item.grams ? (isUnit ? `${item.grams} qty` : `${item.grams}g`) : '';
  return `<div class="food-read-row" style="display:flex;align-items:center;gap:4px;">
    ${multi ? `<span class="drag-handle" onpointerdown="startFoodRowDrag(event,'${clientId}','${dayType}',${mealIdx},'${target}')" aria-label="Drag to reorder">&#10022;&#10022;</span>` : ''}
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex:1;min-width:0;">
      <div style="min-width:0;">
        <div class="food-read-name">${escapeHtml(item.food||'Untitled food')}</div>
        <div class="food-read-meta">
          ${amount ? `<span class="food-read-grams">${amount}</span>` : ''}
          <span class="food-read-macros">${Math.round(item.cals||0)} kcal · ${Math.round(item.protein||0)}p / ${Math.round(item.carbs||0)}c / ${Math.round(item.fats||0)}f</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button type="button" class="icon-btn" onclick="openFoodPicker('${clientId}','${dayType}',${mealIdx},${itemIdx},'${target}')" aria-label="Edit food">&#9998;</button>
        <button type="button" class="icon-btn icon-btn-danger" onclick="removeMealFoodItem('${clientId}','${dayType}',${mealIdx},${itemIdx},'${target}')" aria-label="Remove food">&#10005;</button>
      </div>
    </div>
  </div>`;
}
function startFoodRowDrag(e, clientId, dayType, mealIdx, target){
  const row = e.target.closest('.food-read-row');
  if(!row) return;
  const container = row.closest('.meal-food-rows');
  if(!container) return;
  startRowDrag(e, container, '.food-read-row', (from,to)=>reorderMealFoodItem(clientId, dayType, mealIdx, from, to, target));
}
async function reorderMealFoodItem(clientId, dayType, mealIdx, fromIdx, toIdx, target){
  const c = getClient(clientId);
  const meals = mealsForTarget(c, dayType, target);
  if(!meals[mealIdx]) return;
  const items = meals[mealIdx].items;
  const [moved] = items.splice(fromIdx,1);
  items.splice(toIdx,0,moved);
  const { error } = await saveMealsForTarget(clientId, dayType, meals, target);
  if(error){ showToast('Could not save new order: '+error.message, true); }
  switchMealTab(dayType);
}
async function removeMealFoodItem(clientId, dayType, mealIdx, itemIdx, target){
  const c = getClient(clientId);
  const meals = mealsForTarget(c, dayType, target);
  if(!meals[mealIdx]) return;
  meals[mealIdx].items.splice(itemIdx,1);
  const { error } = await saveMealsForTarget(clientId, dayType, meals, target);
  if(error){ showToast('Could not remove food: '+error.message, true); return; }
  showToast('Food removed');
  switchMealTab(dayType);
}
async function renameMeal(clientId, dayType, mealIdx, name){
  const c = getClient(clientId);
  const meals = prescribedMealsFor(c, dayType);
  if(!meals[mealIdx]) return;
  meals[mealIdx].name = name.trim() || `Meal ${mealIdx+1}`;
  const { error } = await saveMealsForTarget(clientId, dayType, meals, 'plan');
  if(error){ showToast('Could not rename meal: '+error.message, true); return; }
  showToast('Meal renamed');
}
async function saveMealInstructions(clientId, dayType, mealIdx, text){
  const c = getClient(clientId);
  const meals = prescribedMealsFor(c, dayType);
  if(!meals[mealIdx]) return;
  meals[mealIdx].instructions = text;
  const { error } = await saveMealsForTarget(clientId, dayType, meals, 'plan');
  if(error){ showToast('Could not save instructions: '+error.message, true); return; }
  showToast('Instructions saved');
}
async function addMealToDay(clientId, dayType){
  const c = getClient(clientId);
  const meals = prescribedMealsFor(c, dayType);
  meals.push({ name:`Meal ${meals.length+1}`, time:'', items:[], instructions:'' });
  const { error } = await saveMealsForTarget(clientId, dayType, meals, 'plan');
  if(error){ showToast('Could not add meal: '+error.message, true); return; }
  showToast('Meal added');
  switchMealTab(dayType);
}
async function deleteMeal(clientId, dayType, mealIdx){
  const c = getClient(clientId);
  const meals = prescribedMealsFor(c, dayType);
  if(meals.length<=1){ showToast('A meal day needs at least one meal', true); return; }
  meals.splice(mealIdx,1);
  const { error } = await saveMealsForTarget(clientId, dayType, meals, 'plan');
  if(error){ showToast('Could not delete meal: '+error.message, true); return; }
  showToast('Meal deleted');
  switchMealTab(dayType);
}
function toggleMealCopyPopover(id, clientId, dayType, mi){
  const el = document.getElementById(id);
  if(!el) return;
  const willOpen = el.style.display === 'none';
  document.querySelectorAll('.meal-copy-popover').forEach(p=>p.style.display='none');
  el.style.display = willOpen ? 'block' : 'none';
  if(willOpen) updateCopyMealSlotOptions(clientId, dayType, mi);
}
function updateCopyMealSlotOptions(clientId, dayType, mi){
  const c = getClient(clientId);
  const daySel = document.getElementById(`copyDaySel_${dayType}_${mi}`);
  const slotSel = document.getElementById(`copySlotSel_${dayType}_${mi}`);
  if(!daySel || !slotSel) return;
  const targetDayType = daySel.value;
  const targetMeals = prescribedMealsFor(c, targetDayType);
  slotSel.innerHTML = targetMeals.map((m,i)=>`<option value="${i}">${escapeHtml(m.name||`Meal ${i+1}`)}</option>`).join('') + `<option value="__new__">+ New meal at end</option>`;
}
async function confirmCopyMeal(clientId, dayType, mealIdx){
  const c = getClient(clientId);
  const daySel = document.getElementById(`copyDaySel_${dayType}_${mealIdx}`);
  const slotSel = document.getElementById(`copySlotSel_${dayType}_${mealIdx}`);
  if(!daySel || !slotSel) return;
  const targetDayType = daySel.value;
  const targetSlotVal = slotSel.value;
  const sourceMeals = prescribedMealsFor(c, dayType);
  const source = sourceMeals[mealIdx];
  if(!source) return;
  const copiedItems = (source.items||[]).map(it=>({...it}));
  const copiedInstructions = source.instructions||'';
  const isSameDay = targetDayType === dayType;
  const targetMeals = prescribedMealsFor(c, targetDayType).map(m=>({...m, items:(m.items||[]).map(it=>({...it}))}));
  if(targetSlotVal === '__new__'){
    targetMeals.push({ name: `${source.name} (Copy)`, time: source.time||'', items: copiedItems, instructions: copiedInstructions });
  } else {
    const targetIdx = parseInt(targetSlotVal, 10);
    if(isSameDay && targetIdx === mealIdx){ showToast('Choose a different meal to copy into', true); return; }
    const dest = targetMeals[targetIdx];
    if(!dest) return;
    if((dest.items&&dest.items.length) || dest.instructions){
      if(!confirm(`Overwrite "${dest.name}" with a copy of "${source.name}"? This replaces its current foods and instructions.`)) return;
    }
    dest.items = copiedItems;
    dest.instructions = copiedInstructions;
  }
  const { error } = await saveMealsForTarget(clientId, targetDayType, targetMeals, 'plan');
  if(error){ showToast('Could not copy meal: '+error.message, true); return; }
  const label = (dayTypesFor(c).find(([k])=>k===targetDayType)||[,targetDayType])[1];
  showToast(`Copied to ${label}`);
  switchMealTab(dayType);
}
function startMealBlockDrag(e, clientId, dayType){
  const row = e.target.closest('.meal-block');
  if(!row) return;
  const container = row.parentElement;
  if(!container) return;
  startRowDrag(e, container, '.meal-block', (from,to)=>reorderMealBlocks(clientId, dayType, from, to));
}
async function reorderMealBlocks(clientId, dayType, fromIdx, toIdx){
  const c = getClient(clientId);
  const meals = prescribedMealsFor(c, dayType);
  const [moved] = meals.splice(fromIdx,1);
  meals.splice(toIdx,0,moved);
  const { error } = await saveMealsForTarget(clientId, dayType, meals, 'plan');
  if(error){ showToast('Could not save new order: '+error.message, true); return; }
  switchMealTab(dayType);
}
async function resetClientMealLog(clientId, dayType){
  const c = getClient(clientId);
  const copy = prescribedMealsFor(c, dayType).map(m => ({ name: m.name, time: m.time, items: (m.items||[]).map(it=>({...it})) }));
  const newLog = { ...c.clientMealLog, [dayType]: copy };
  const { error } = await sb.from('clients').update({ client_meal_log: newLog }).eq('id', clientId);
  if(error){ showToast('Could not reset: '+error.message, true); return; }
  c.clientMealLog = newLog;
  showToast("Reset to your coach's plan");
  switchMealTab(dayType);
}

/* ======================================================================
   FOOD PICKER — full-screen overlay used by both coach (editing the
   prescribed plan) and client (editing their own food log) to search the
   Food Database and add/edit a single food item on a specific meal.
   ====================================================================== */
let foodPickerCtx = null;
let foodPickerQuery = '';
function openFoodPicker(clientId, dayType, mealIdx, itemIdx, target){
  const c = getClient(clientId);
  const meals = mealsForTarget(c, dayType, target);
  const meal = meals[mealIdx];
  foodPickerCtx = { clientId, dayType, mealIdx, itemIdx: (itemIdx===null||itemIdx===undefined)?null:itemIdx, target, selected:null, qty:'' };
  foodPickerQuery = '';
  if(foodPickerCtx.itemIdx!=null && meal){
    const item = meal.items[foodPickerCtx.itemIdx];
    if(item){
      const ref = NUTRITION_DB.find(f=>f.food.toLowerCase()===(item.food||'').toLowerCase());
      foodPickerCtx.selected = ref || { food:item.food, cals:item.cals, protein:item.protein, carbs:item.carbs, fats:item.fats, unit:'g', base:item.grams||100 };
      foodPickerCtx.qty = item.grams!=null ? String(item.grams) : '';
      foodPickerQuery = item.food || '';
    }
  }
  document.body.insertAdjacentHTML('beforeend', foodPickerHTML());
}
function closeFoodPicker(){
  foodPickerCtx = null;
  const el = document.getElementById('foodPickerOverlay');
  if(el) el.remove();
}
function foodPickerHTML(){
  const q = foodPickerQuery.trim().toLowerCase();
  const results = NUTRITION_DB.filter(f=>!q || f.food.toLowerCase().includes(q)).slice(0,30);
  const c = getClient(foodPickerCtx.clientId);
  const meals = mealsForTarget(c, foodPickerCtx.dayType, foodPickerCtx.target);
  const meal = meals[foodPickerCtx.mealIdx];
  const mealName = meal ? meal.name : 'meal';
  const editing = foodPickerCtx.itemIdx!=null;
  return `
  <div class="lightbox-overlay" id="foodPickerOverlay" style="align-items:flex-start;">
    <div class="food-picker-panel">
      <div class="food-picker-header">
        <button type="button" class="menu-btn" style="display:flex;" onclick="closeFoodPicker()" aria-label="Close">&#8592;</button>
        <div style="font-weight:800;font-size:15px;">${editing?'Edit food':'Add food'} — ${escapeHtml(mealName)}</div>
      </div>
      <input type="text" id="foodPickerSearch" placeholder="Search food database..." value="${foodPickerQuery.replace(/"/g,'&quot;')}" oninput="updateFoodPickerQuery(this.value)" autocomplete="off">
      <div class="food-picker-list">
        ${results.length===0 ? `<div class="muted" style="font-size:12.5px;padding:10px 0;">No matches — ask your coach to add it to the Food Database.</div>` : results.map(f=>`
        <div class="food-picker-row${foodPickerCtx.selected && foodPickerCtx.selected.food===f.food?' selected':''}">
          <div style="min-width:0;">
            <div style="font-weight:700;font-size:13.5px;">${escapeHtml(f.food)}</div>
            <div class="muted" style="font-size:11.5px;">${Math.round(f.cals)} kcal / ${f.unit==='unit'?'unit':'100g'}</div>
          </div>
          <button type="button" class="btn-sm ${foodPickerCtx.selected && foodPickerCtx.selected.food===f.food?'':'btn-ghost'}" onclick="selectFoodInPicker('${f.food.replace(/'/g,"\\'")}')">${foodPickerCtx.selected && foodPickerCtx.selected.food===f.food ? 'Selected' : 'Select'}</button>
        </div>`).join('')}
      </div>
      ${foodPickerCtx.selected ? `
      <div class="food-picker-selected">
        <div class="muted" style="font-size:12px;margin-bottom:8px;">Selected: <b style="color:var(--text);">${escapeHtml(foodPickerCtx.selected.food)}</b></div>
        <div class="row" style="align-items:flex-end;">
          <div class="field"><label>${foodPickerCtx.selected.unit==='unit'?'Qty':'Grams'}</label><input type="number" id="foodPickerQty" value="${foodPickerCtx.qty||''}" oninput="foodPickerCtx.qty=this.value"></div>
          <div class="field" style="flex:0 0 auto;"><button type="button" class="btn btn-sm" onclick="confirmFoodPicker()">${editing?'Save Changes':'Add to Meal'}</button></div>
        </div>
      </div>` : ''}
    </div>
  </div>`;
}
function updateFoodPickerQuery(v){
  foodPickerQuery = v;
  const el = document.getElementById('foodPickerOverlay');
  if(!el) return;
  el.outerHTML = foodPickerHTML();
  const input = document.getElementById('foodPickerSearch');
  if(input){ input.focus(); input.selectionStart = input.selectionEnd = input.value.length; }
}
function selectFoodInPicker(foodName){
  const f = NUTRITION_DB.find(x=>x.food===foodName);
  if(!f || !foodPickerCtx) return;
  foodPickerCtx.selected = f;
  const el = document.getElementById('foodPickerOverlay');
  if(el) el.outerHTML = foodPickerHTML();
}
async function confirmFoodPicker(){
  if(!foodPickerCtx || !foodPickerCtx.selected){ showToast('Select a food first', true); return; }
  const qtyEl = document.getElementById('foodPickerQty');
  const qty = parseFloat(qtyEl.value)||0;
  if(!qty){ showToast('Enter a quantity', true); return; }
  const f = foodPickerCtx.selected;
  const factor = qty / (f.base||100);
  const newItem = { food:f.food, grams:qty, cals:Math.round(f.cals*factor), protein:+(f.protein*factor).toFixed(1), carbs:+(f.carbs*factor).toFixed(1), fats:+(f.fats*factor).toFixed(1) };
  const { clientId, dayType, mealIdx, itemIdx, target } = foodPickerCtx;
  const c = getClient(clientId);
  const meals = mealsForTarget(c, dayType, target);
  const meal = meals[mealIdx];
  if(!meal){ closeFoodPicker(); return; }
  if(itemIdx!=null) meal.items[itemIdx] = newItem;
  else meal.items.push(newItem);
  const { error } = await saveMealsForTarget(clientId, dayType, meals, target);
  if(error){ showToast('Could not save: '+error.message, true); closeFoodPicker(); return; }
  const wasEdit = itemIdx!=null;
  closeFoodPicker();
  showToast(wasEdit ? 'Food updated' : 'Food added');
  switchMealTab(dayType);
}

function foodDbReadRow(f,i,editable){

function foodDbEditRow(f,i){

    <td style="display:flex;gap:6px;"><button type="button" class="btn-sm" onclick="saveFoodDbEdit(${i})">Save</button><button type="button" class="btn-sm btn-ghost" onclick="cancelEditFoodDb()">Cancel</button></td>

function startEditFoodDb(i){ editingFoodDbIdx = i; render(); }
function cancelEditFoodDb(){ editingFoodDbIdx = null; render(); }
async function saveFoodDbEdit(i){
  const item = NUTRITION_DB[i];
  if(!item) return;
  const name = document.getElementById(`ef_name_${i}`).value.trim();
  if(!name){ showToast('Enter a food name', true); return; }
  const base = parseFloat(document.getElementById(`ef_base_${i}`).value)||100;

    food:name, cals:parseFloat(document.getElementById(`ef_cals_${i}`).value)||0,
    protein:parseFloat(document.getElementById(`ef_pro_${i}`).value)||0, carbs:parseFloat(document.getElementById(`ef_cho_${i}`).value)||0,
    fats:parseFloat(document.getElementById(`ef_fat_${i}`).value)||0, unit:(base===1?'unit':'g'), base
  };
  const { error } = await sb.from('reference_data').update({
    name:updated.food, cals:updated.cals, protein:updated.protein, carbs:updated.carbs, fats:updated.fats, unit:updated.unit, base:updated.base
  }).eq('id', item.id);
  if(error){ showToast('Could not save changes: '+error.message, true); return; }
  Object.assign(item, updated);
  editingFoodDbIdx = null;
  render(); showToast('Food updated');
}
async function addFoodToDb(){
  const name = document.getElementById('nf_name').value.trim();
  if(!name){ showToast('Enter a food name', true); return; }
  const base = parseFloat(document.getElementById('nf_base').value)||100;
  const newFood = {

function checkinQTypeLabel(t){ return ({text:'Short Text',textarea:'Long Text',select:'Dropdown',rating:'1-5 Rating'})[t]||t; }
function slugifyKey(label, existingKeys){
  let base = label.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).map((w,i)=> i===0?w:w.charAt(0).toUpperCase()+w.slice(1)).join('');
  if(!base) base = 'question';
  let key = base, n = 2;
  while(existingKeys.includes(key)){ key = base + n; n++; }
  return key;
}
